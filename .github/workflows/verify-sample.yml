name: Verify fictional CSV delivery

on:
  pull_request:
  push:
    branches:
      - codex/sample-release

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate synthetic CSV and delivery ZIP
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/verify_sample.py
